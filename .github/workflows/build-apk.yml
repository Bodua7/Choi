name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip web source into assets
        run: |
          mkdir -p app/src/main/assets/www
          ZIP_FILE=$(find app -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Không tìm thấy file .zip trong thư mục app/"
            ls -la app/
            exit 1
          fi
          echo "Dùng file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d app/src/main/assets/www

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeVuCauSinh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
