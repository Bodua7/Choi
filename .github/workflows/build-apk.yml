name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Giai nen project (lop 1 - toan bo project Android)
        run: |
          PROJECT_ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$PROJECT_ZIP" ]; then
            echo "Khong tim thay file .zip nao o goc repo. Danh sach file hien co:"
            find . -not -path "./.git/*" -not -path "./.github/*"
            exit 1
          fi
          echo "Giai nen project tu: $PROJECT_ZIP"
          mkdir -p build-workspace
          unzip -o "$PROJECT_ZIP" -d build-workspace

      - name: Giai nen web source (lop 2 - game assets)
        run: |
          WEB_ZIP=$(find build-workspace/app -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$WEB_ZIP" ]; then
            echo "Khong tim thay file .zip game trong build-workspace/app/. Noi dung app/:"
            ls -la build-workspace/app
            exit 1
          fi
          echo "Giai nen web source tu: $WEB_ZIP"
          mkdir -p build-workspace/app/src/main/assets/www
          unzip -o "$WEB_ZIP" -d build-workspace/app/src/main/assets/www

      - name: Build debug APK
        working-directory: build-workspace
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeVuCauSinh-debug-apk
          path: build-workspace/app/build/outputs/apk/debug/app-debug.apk
